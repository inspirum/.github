name: PHP

on:
  workflow_call:
    inputs:
      php:
        description: JSON array of PHP versions to test on
        type: string
        default: '["8.1", "8.2", "8.3", "8.4", "8.5"]'
      lint-php:
        description: PHP version to run coding standard and dependency checks on
        type: string
        default: '8.5'
      coverage-php:
        description: PHP version to collect and upload code coverage on, empty to skip
        type: string
        default: ''

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up PHP ${{ inputs.lint-php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.lint-php }}
          coverage: none
      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ inputs.lint-php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ inputs.lint-php }}-
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Run coding standard
        run: vendor/bin/phpcs
      - name: Run dependency analyser
        run: vendor/bin/composer-dependency-analyser

  test:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == inputs.coverage-php && 'xdebug' || 'none' }}
      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Run static analysis
        run: vendor/bin/phpstan analyse -c phpstan.neon --no-progress
      - name: Run tests
        if: matrix.php != inputs.coverage-php
        run: vendor/bin/phpunit --no-coverage
      - name: Run tests with coverage
        if: matrix.php == inputs.coverage-php
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.clover
      - name: Upload coverage
        if: matrix.php == inputs.coverage-php
        run: |
          composer require --dev --no-interaction --no-progress --quiet scrutinizer/ocular
          vendor/bin/ocular code-coverage:upload --format=php-clover coverage.clover
